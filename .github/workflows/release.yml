name: build-and-release
on:
  # Calendar nightly is Docker :nightly from main. It does not touch the unstable branch.
  schedule:
    - cron: "27 12 * * *"
  workflow_dispatch:
  push:
    branches:
      - unstable
    tags:
      - v*
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      # Map first: secrets cannot be referenced in steps.if.
      CODESIGN_URL: ${{ secrets.CODESIGN_URL }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Scheduled runs always build main, even if GitHub starts the workflow from another ref.
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/main' || github.ref }}
      - run: git fetch --force --tags
      - name: Choose release channel
        id: channel
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == schedule ]]; then
            channel=nightly
            args='release --nightly --clean --timeout 60m'
          elif [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch && "${GITHUB_REF}" == refs/heads/main ]]; then
            channel=nightly
            args='release --nightly --clean --timeout 60m'
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            channel=release
            args='release --clean --timeout 60m'
          elif [[ "${GITHUB_REF}" == refs/heads/unstable ]]; then
            channel=unstable
            args='release --nightly --clean --timeout 60m'
          else
            echo "refusing to release from ${GITHUB_REF} (${GITHUB_EVENT_NAME})" >&2
            exit 1
          fi
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "CHANNEL=${channel}" >> "${GITHUB_ENV}"
          echo "args=${args}" >> "${GITHUB_OUTPUT}"
      - name: Install package tooling
        run: sudo apt-get update && sudo apt-get install -y rpm genisoimage clang llvm
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log into GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log into Docker Hub
        if: env.DOCKERHUB_PASSWORD != ''
        uses: docker/login-action@v4
        with:
          username: golift
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Enable Docker Hub publish
        if: env.DOCKERHUB_PASSWORD != ''
        run: echo DOCKERHUB_PUBLISH=1 >> "$GITHUB_ENV"
      - name: Skip Docker Hub
        if: env.DOCKERHUB_PASSWORD == ''
        run: echo '::warning::DOCKERHUB_PASSWORD is empty; skipping Docker Hub login and Hub image publish. Grant the org secret to this public repository (or add a repo secret) to resume golift/unpackerr pushes.'
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_SIGNING_KEY }}
      - name: Create GPG_SIGNING_KEY file
        run: echo '${{ secrets.GPG_SIGNING_KEY }}' > /tmp/key.gpg
      - name: Save iteration in Revision
        run: echo REVISION=$(git rev-list --count --all || echo 0) >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golift codesign
        env:
          GOBIN: ${{ runner.temp }}/codesign-bin
        run: |
          set -euo pipefail
          mkdir -p "${GOBIN}"
          go install golift.io/codesign/cmd/codesign@v1.0.3
          echo "${GOBIN}" >> "${GITHUB_PATH}"
          echo "CODESIGN_BIN=${GOBIN}/codesign" >> "${GITHUB_ENV}"
      # energye/systray needs CGO on Darwin. Copy osxcross from goreleaser-cross
      # so ubuntu-latest can compile the Cocoa backend (o64-clang / oa64-clang).
      - name: Install Darwin CGO toolchain
        run: |
          set -euo pipefail
          docker pull ghcr.io/goreleaser/goreleaser-cross:v1.27.0-1
          cid="$(docker create ghcr.io/goreleaser/goreleaser-cross:v1.27.0-1)"
          sudo docker cp "${cid}:/usr/local/osxcross" /usr/local/osxcross
          docker rm "${cid}"
          test -x /usr/local/osxcross/bin/o64-clang
          test -x /usr/local/osxcross/bin/oa64-clang
          echo /usr/local/osxcross/bin >> "${GITHUB_PATH}"
          echo OSX_CROSS=1 >> "${GITHUB_ENV}"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: ${{ steps.channel.outputs.args }}
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          # GITHUB_ENV alone is not enough: goreleaser-action only forwards
          # this map, and nightly.version_template needs REVISION.
          REVISION: ${{ env.REVISION }}
          OSX_CROSS: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_PRO_KEY }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          USER: github-actions
          GPG_SIGNING_KEY: /tmp/key.gpg
          GPG_SIGNING_KEY_ID: ${{ steps.import_gpg.outputs.keyid }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          CODESIGN_URL: ${{ secrets.CODESIGN_URL }}
          CODESIGN_CLIENT_CERT: ${{ secrets.CODESIGN_CLIENT_CERT }}
          CODESIGN_CLIENT_KEY: ${{ secrets.CODESIGN_CLIENT_KEY }}
          CODESIGN_NAME: Unpackerr
          CODESIGN_WEBSITE: https://unpackerr.zip
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
          AUR_DEPLOY_KEY: ${{ secrets.AUR_DEPLOY_KEY }}
      - uses: golift/upload-packagecloud@eb0067369b59340b04dce218010960ebe74720b2 # v1.1.1
        if: env.CHANNEL != 'nightly'
        with:
          userrepo: ${{ env.CHANNEL == 'release' && 'golift/pkgs' || 'golift/unstable' }}
          apitoken: ${{ secrets.PACKAGECLOUD_TOKEN }}
          packages: dist/
          rpmdists: el/6
          debdists: ubuntu/focal
      - name: Upload to unstable.golift.io
        if: env.CHANNEL == 'unstable'
        env:
          UNSTABLE_UPLOAD_KEY: ${{ secrets.UNSTABLE_UPLOAD_KEY }}
          VERSION: ${{ github.ref_name }}
        run: bash .github/scripts/unstable_upload.sh dist
