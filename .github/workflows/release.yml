name: build-and-release
# Fork note: this workflow is intentionally reduced to a single GHCR Docker
# job. The upstream pipeline (GoReleaser Pro split/merge, Apple notarization,
# Windows Authenticode, packagecloud, AUR, unstable.golift.io) needs signing
# and upload secrets that are not configured on this fork, and its
# require_secrets.sh step fails closed when they are missing.
on:
  push:
    branches:
      - unstable
    tags:
      - v*
  pull_request:
    branches:
    - main
permissions:
  contents: read
jobs:
  docker-ghcr-build-push:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/unstable' || github.event_name == 'pull_request'
    name: Deploy GHCR Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: 'arm64'

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,enable=true,event=branch

      # settings.sh was removed upstream; compute the same build-args inline.
      - name: Set docker build-args
        run: |
          set -euo pipefail
          git fetch --force --tags
          DATE="$(date -u +%Y-%m-%dT%H:%M:00Z)"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git tag --sort version:refname | tail -n1 | sed 's/^v//')"
          fi
          [ -n "${VERSION}" ] || VERSION=development
          ITERATION="$(git rev-list --count --all || echo 0)"
          COMMIT="$(git rev-parse --short HEAD || echo 0)"
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          # VERSION and BRANCH come from git ref names and end up inside the
          # -ldflags quoted string of the Dockerfile's RUN go build; a stray
          # double quote there breaks Go's ldflags field splitting, so keep only
          # plain ref characters.
          VERSION="$(printf '%s' "${VERSION}" | tr -cd 'A-Za-z0-9._/-')"
          BRANCH="$(printf '%s' "${BRANCH}" | tr -cd 'A-Za-z0-9._/-')"
          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}"
          # LICENSE, DESC, VENDOR and AUTHOR use the Dockerfile.ghcr ARG defaults.
          for item in DATE COMMIT VERSION ITERATION BRANCH SOURCE_URL; do
            echo "build-arg: ${item}=${!item}"
            echo "${item}=${!item}" >> "${GITHUB_ENV}"
          done

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          platforms: |-
            linux/arm64
          context: .
          file: init/docker/Dockerfile.ghcr
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ env.DATE }}
            COMMIT=${{ env.COMMIT }}
            VERSION=${{ env.VERSION }}
            ITERATION=${{ env.ITERATION }}
            BRANCH=${{ env.BRANCH }}
            SOURCE_URL=${{ env.SOURCE_URL }}
