name: build-and-release
on:
  # Calendar nightly is Docker :nightly from main. It does not touch the unstable branch.
  schedule:
    - cron: "27 12 * * *"
  workflow_dispatch:
  push:
    branches:
      - unstable
    tags:
      - v*
# Jobs that publish (GitHub Release, GHCR) set write on the job. The rest only checkout.
permissions:
  contents: read

# Darwin App/DMG notarization needs xcrun/codesign (macOS). Linux/Windows/FreeBSD
# split on ubuntu; merge publishes Docker, GitHub, Homebrew, AUR, packagecloud.
# See README.md in this folder.
jobs:
  channel:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      extra: ${{ steps.channel.outputs.extra }}
      revision: ${{ steps.revision.outputs.revision }}
      pkg_release: ${{ steps.channel.outputs.pkg_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/main' || github.ref }}
      - name: Count git revisions
        id: revision
        run: echo "revision=$(git rev-list --count --all || echo 0)" >> "${GITHUB_OUTPUT}"
      - name: Choose release channel
        id: channel
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          set -euo pipefail
          extra=
          if [[ "${GITHUB_EVENT_NAME}" == schedule ]]; then
            channel=nightly
            extra=--nightly
          elif [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch && "${GITHUB_REF}" == refs/heads/main ]]; then
            channel=nightly
            extra=--nightly
          elif [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/tags/v* ]]; then
            channel=release
          elif [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/heads/unstable ]]; then
            channel=unstable
            extra=--nightly
          else
            echo "refusing to release from ${GITHUB_REF} (${GITHUB_EVENT_NAME})" >&2
            exit 1
          fi
          # Tagged debs/rpms are 0.15.3-REVISION (nFPM release, baked into yaml
          # because GoReleaser copies that field verbatim). --nightly already
          # puts REVISION in .Version; leave pkg_release empty so it is not
          # doubled as 0.15.3~REVISION-REVISION (or left as ${PKG_RELEASE}).
          if [[ ${channel} == release ]]; then
            pkg_release=${REVISION}
          else
            pkg_release=
          fi
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "extra=${extra}" >> "${GITHUB_OUTPUT}"
          echo "pkg_release=${pkg_release}" >> "${GITHUB_OUTPUT}"
          echo "CHANNEL=${channel} extra=${extra} pkg_release=${pkg_release}"

  require-secrets:
    name: require secrets
    needs: channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/main' || github.ref }}
      - name: Fail if publishing secrets are missing
        env:
          CHANNEL: ${{ needs.channel.outputs.channel }}
          GORELEASER_PRO_KEY: ${{ secrets.GORELEASER_PRO_KEY }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          CODESIGN_URL: ${{ secrets.CODESIGN_URL }}
          CODESIGN_CLIENT_CERT: ${{ secrets.CODESIGN_CLIENT_CERT }}
          CODESIGN_CLIENT_KEY: ${{ secrets.CODESIGN_CLIENT_KEY }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          AUR_DEPLOY_KEY: ${{ secrets.AUR_DEPLOY_KEY }}
          UNSTABLE_UPLOAD_KEY: ${{ secrets.UNSTABLE_UPLOAD_KEY }}
        run: bash .github/scripts/require_secrets.sh

  split:
    name: "Build: ${{ matrix.goos }}"
    needs: [channel, require-secrets]
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, freebsd]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/main' || github.ref }}
      - run: git fetch --force --tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install package tooling
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Install fpm
        if: matrix.goos == 'freebsd'
        run: sudo gem install --no-document fpm
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_SIGNING_KEY }}
      - name: Create GPG_SIGNING_KEY file
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: printf '%s\n' "${GPG_SIGNING_KEY}" > /tmp/key.gpg
      - name: Bake nFPM release
        if: matrix.goos == 'linux'
        env:
          PKG_RELEASE: ${{ needs.channel.outputs.pkg_release }}
        run: bash .github/scripts/nfpm_release.sh .goreleaser.yaml
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean --split --timeout 60m ${{ needs.channel.outputs.extra }}
        env:
          # GGOOS filters targets without leaking GOOS into before-hook `go run`.
          GGOOS: ${{ matrix.goos }}
          CHANNEL: ${{ needs.channel.outputs.channel }}
          REVISION: ${{ needs.channel.outputs.revision }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_PRO_KEY }}
          USER: github-actions
          GPG_SIGNING_KEY: /tmp/key.gpg
          GPG_SIGNING_KEY_ID: ${{ steps.import_gpg.outputs.keyid }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      - name: Build FreeBSD pkgng txz
        if: matrix.goos == 'freebsd'
        env:
          REVISION: ${{ needs.channel.outputs.revision }}
        run: bash .github/scripts/freebsd_txz.sh dist/freebsd
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.goos }}
          path: dist/${{ matrix.goos }}
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # OIDC + mTLS certs stay off linux/freebsd. signerd is Windows-only.
  split-windows:
    name: "Build: windows"
    needs: [channel, require-secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/main' || github.ref }}
      - run: git fetch --force --tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Create GPG_SIGNING_KEY file
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: printf '%s\n' "${GPG_SIGNING_KEY}" > /tmp/key.gpg
      - name: Install golift codesign
        env:
          GOBIN: ${{ runner.temp }}/codesign-bin
        run: |
          set -euo pipefail
          mkdir -p "${GOBIN}"
          go install golift.io/codesign/cmd/codesign@v1.0.3
          echo "${GOBIN}" >> "${GITHUB_PATH}"
          echo "CODESIGN_BIN=${GOBIN}/codesign" >> "${GITHUB_ENV}"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean --split --timeout 60m ${{ needs.channel.outputs.extra }}
        env:
          GGOOS: windows
          CHANNEL: ${{ needs.channel.outputs.channel }}
          REVISION: ${{ needs.channel.outputs.revision }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_PRO_KEY }}
          USER: github-actions
          GPG_SIGNING_KEY: /tmp/key.gpg
          CODESIGN_URL: ${{ secrets.CODESIGN_URL }}
          CODESIGN_CLIENT_CERT: ${{ secrets.CODESIGN_CLIENT_CERT }}
          CODESIGN_CLIENT_KEY: ${{ secrets.CODESIGN_CLIENT_KEY }}
          CODESIGN_NAME: Unpackerr
          CODESIGN_WEBSITE: https://unpackerr.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows
          path: dist/windows
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  split-darwin:
    name: "Build: darwin"
    needs: [channel, require-secrets]
    # Nightly is Docker-only; skip Apple notarization.
    if: needs.channel.outputs.channel != 'nightly'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/main' || github.ref }}
      - run: git fetch --force --tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Import signing certificate and notary credentials
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: bash .github/scripts/macos_keychain.sh
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean --split --timeout 60m ${{ needs.channel.outputs.extra }}
        env:
          GGOOS: darwin
          CHANNEL: ${{ needs.channel.outputs.channel }}
          REVISION: ${{ needs.channel.outputs.revision }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_PRO_KEY }}
          USER: github-actions
          KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
          MACOS_SIGN_IDENTITY: ${{ env.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE_NAME: ${{ env.MACOS_NOTARY_PROFILE_NAME }}
      - name: Staple notarized DMG
        run: bash .github/scripts/macos_staple.sh dist/darwin
      - name: Pack Darwin dist
        run: |
          set -euo pipefail
          # hdiutil leaves a writable clone of Unpackerr.app next to the DMG.
          # upload-artifact on macos hangs for many minutes on that file tree.
          find dist/darwin/dmg -mindepth 2 -maxdepth 2 -type d -name 'Unpackerr' -exec rm -rf {} +
          du -sh dist/darwin dist/darwin/* 2>/dev/null || true
          tar -C dist/darwin -cf dist-darwin.tar .
          ls -lh dist-darwin.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-darwin
          path: dist-darwin.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
        env:
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: "5"

  release:
    name: "release ${{ needs.channel.outputs.revision }}"
    needs: [channel, require-secrets, split, split-windows, split-darwin]
    if: >-
      always() &&
      !cancelled() &&
      needs.channel.result == 'success' &&
      needs.require-secrets.result == 'success' &&
      needs.split.result == 'success' &&
      needs.split-windows.result == 'success' &&
      (needs.split-darwin.result == 'success' || needs.split-darwin.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    env:
      CHANNEL: ${{ needs.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/main' || github.ref }}
      - run: git fetch --force --tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_SIGNING_KEY }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64,arm
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log into GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log into Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: golift
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Enable Docker Hub publish
        run: echo DOCKERHUB_PUBLISH=1 >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-linux
          path: dist/linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-windows
          path: dist/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-freebsd
          path: dist/freebsd
      - name: Verify FreeBSD txz packages
        run: |
          set -euo pipefail
          ls -l dist/freebsd/unpackerr-*.txz
          for arch in amd64 i386 armhf arm64; do
            ls dist/freebsd/unpackerr-*."${arch}".txz
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.split-darwin.result == 'success'
        with:
          name: dist-darwin
          path: dist
      - name: Unpack Darwin dist
        if: needs.split-darwin.result == 'success'
        run: |
          set -euo pipefail
          mkdir -p dist/darwin
          tar -xf dist/dist-darwin.tar -C dist/darwin
          rm -f dist/dist-darwin.tar
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: continue --merge --timeout 60m
        env:
          CHANNEL: ${{ needs.channel.outputs.channel }}
          REVISION: ${{ needs.channel.outputs.revision }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_PRO_KEY }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          USER: github-actions
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
          AUR_DEPLOY_KEY: ${{ secrets.AUR_DEPLOY_KEY }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      - name: Flatten Linux packages for packagecloud
        if: env.CHANNEL != 'nightly'
        run: |
          set -euo pipefail
          find dist -type f \( -name '*.deb' -o -name '*.rpm' \) -print0 |
            while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              if [ ! -e "dist/${base}" ]; then
                cp "$f" "dist/${base}"
              fi
            done
      - uses: golift/upload-packagecloud@eb0067369b59340b04dce218010960ebe74720b2 # v1.1.1
        if: env.CHANNEL != 'nightly'
        with:
          userrepo: ${{ env.CHANNEL == 'release' && 'golift/pkgs' || 'golift/unstable' }}
          apitoken: ${{ secrets.PACKAGECLOUD_TOKEN }}
          packages: dist/
          rpmdists: el/6
          debdists: ubuntu/focal
      - name: Upload to unstable.golift.io
        if: env.CHANNEL == 'unstable'
        env:
          UNSTABLE_UPLOAD_KEY: ${{ secrets.UNSTABLE_UPLOAD_KEY }}
          CHANNEL: unstable
        run: bash .github/scripts/unstable_upload.sh dist
